<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANTHEON STUDIOS // HERO DOSSIER WIKI</title>
    <style>
        :root {
            --bg-void: #060913;
            --db-gold: #ffb700;
            --db-orange: #ff5500;
            --db-cyan: #00e5ff;
            --db-ki: #00ff88;
            --db-red: #ff3333;
            --panel-bg: rgba(12, 18, 32, 0.92);
            --scouter-glow: 0 0 15px rgba(255, 183, 0, 0.35);
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-void);
            color: var(--db-cyan);
            font-family: var(--font-mono);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 183, 0, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 4px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* HEADER BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--db-gold);
            padding-bottom: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(255, 183, 0, 0.2);
        }

        .sys-title {
            font-size: 1.1rem;
            color: var(--db-gold);
            letter-spacing: 2px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .pulse-orb {
            width: 12px;
            height: 12px;
            background: var(--db-ki);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--db-ki);
            animation: dbPulse 1.2s infinite alternate;
        }

        @keyframes dbPulse { 
            0% { opacity: 0.4; transform: scale(0.9); } 
            100% { opacity: 1; transform: scale(1.2); } 
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--db-cyan);
            color: var(--db-cyan);
            padding: 6px 12px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: var(--db-cyan);
            color: #000;
            box-shadow: 0 0 10px var(--db-cyan);
        }

        /* CARD CONTAINERS */
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--db-gold);
            box-shadow: var(--scouter-glow);
            padding: 22px;
            margin-bottom: 25px;
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .card-header {
            font-size: 0.95rem;
            color: var(--db-gold);
            border-bottom: 1px dashed rgba(255, 183, 0, 0.4);
            padding-bottom: 8px;
            margin-bottom: 18px;
            letter-spacing: 1px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* HERO HEADER BLOCK */
        .hero-banner {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .hero-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--db-gold);
            box-shadow: 0 0 15px rgba(255, 183, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            background: rgba(6, 9, 19, 0.95);
            flex-shrink: 0;
            overflow: hidden;
        }

        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-meta {
            flex: 1;
        }

        .hero-callsign {
            font-size: 1.8rem;
            color: #ffffff;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
        }

        .hero-subtitle {
            font-size: 0.9rem;
            color: var(--db-orange);
            font-weight: bold;
            margin-top: 4px;
        }

        .spec-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 15px;
            background: rgba(6, 9, 19, 0.8);
            padding: 12px;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .spec-label {
            font-size: 0.65rem;
            color: #8a9ba8;
            text-transform: uppercase;
        }

        .spec-val {
            font-size: 0.8rem;
            color: var(--db-ki);
            font-weight: bold;
        }

        /* LORE SECTIONS */
        .lore-block {
            margin-bottom: 18px;
        }

        .lore-title {
            font-size: 0.8rem;
            color: var(--db-cyan);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .lore-text {
            font-size: 0.85rem;
            color: #d0e0f0;
            line-height: 1.6;
            background: rgba(6, 9, 19, 0.6);
            padding: 12px;
            border-left: 3px solid var(--db-gold);
        }

        /* XENOVERSE POWER GRID */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stat-bar-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            font-size: 0.75rem;
        }

        .stat-label {
            width: 120px;
            color: #8a9ba8;
            font-weight: bold;
            text-transform: uppercase;
        }

        .stat-track {
            flex: 1;
            height: 14px;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--db-gold), var(--db-ki));
            box-shadow: 0 0 8px var(--db-ki);
        }

        .stat-num {
            width: 40px;
            text-align: right;
            color: #ffffff;
            font-weight: bold;
        }

        /* EQUIPMENT TAG CLOUD */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .eq-tag {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--db-cyan);
            color: var(--db-cyan);
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="top-bar">
        <div class="sys-title">
            <div class="pulse-orb"></div>
            PANTHEON STUDIOS // HERO DOSSIER WIKI
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">[SHOWCASE_HUB]</a>
            <a href="builder.html" class="nav-btn" style="border-color: var(--db-gold); color: var(--db-gold);">[HERO_BUILDER]</a>
            <a href="profile.html" class="nav-btn">[MY_PROFILE]</a>
            <a href="admin.html" class="nav-btn">[TIME_NEST_ADMIN]</a>
        </div>
    </div>

    <!-- MAIN DOSSIER CONTAINER -->
    <div id="dossier-content">
        <!-- Dynamically rendered via JavaScript below -->
    </div>
</div>

<script>
    // DEFAULT BUILT-IN HERO DATABASE
    const defaultHeroes = {
        "kaige": {
            id: "kaige",
            callsign: "KAIGE",
            realName: "RESTRICTED",
            showTitle: "Project: Phantom Frequency",
            role: "Lead Heavy Strike / Spatial Titan",
            race: "Frieza Race",
            status: "UNLEASHED / ACTIVE",
            height: "Twice Frieza's Height",
            avatarUrl: "",
            bio: "Standing nearly twice the height of Frieza, Kaige is a towering Frieza-Race powerhouse built for dominant close-quarters strike combat. Operating inside the Time Nest, Kaige uses sheer physical mass paired with precision spatial awareness.",
            narrative: "Serves as the front-line anchor in 'Project: Phantom Frequency'. Kaige leads the high-impact Future Saga DLC missions inside the Time Nest, turning chaotic battlefield dynamics in favor of the Time Patrol.",
            capabilities: "Master of the Center of Gravity system for spatial control. Known for manually landing the Dark Inscription move and dropping massive ultimate damage via Gigantic Nova.",
            skills: [
                { label: "MAX HEALTH", value: 95 },
                { label: "MAX KI", value: 85 },
                { label: "MAX STAMINA", value: 90 },
                { label: "BASIC ATTACK", value: 88 },
                { label: "STRIKE SUPER", value: 98 },
                { label: "KI BLAST SUPER", value: 75 }
            ],
            equipment: ["Dark Inscription", "Center of Gravity System", "Gigantic Nova", "Strike Boost Super Soul", "Deadzone Adjust Script"]
        },
        "ghostwire": {
            id: "ghostwire",
            callsign: "GHOSTWIRE",
            realName: "Aria Kade",
            showTitle: "Project: Ghostline Brief",
            role: "Narrative Lead / Ki Tactician",
            race: "Earthling / Cyber-Enhanced",
            status: "ACTIVE",
            height: "5'9\"",
            avatarUrl: "",
            bio: "A strategic mastermind skilled in long-range Ki manipulation and signal disruption.",
            narrative: "Coordinates tactical intel during intense squad engagements across show episodes.",
            capabilities: "Specializes in high Ki Blast Super outputs and field frequency hacking.",
            skills: [
                { label: "MAX HEALTH", value: 75 },
                { label: "MAX KI", value: 95 },
                { label: "MAX STAMINA", value: 85 },
                { label: "BASIC ATTACK", value: 70 },
                { label: "STRIKE SUPER", value: 65 },
                { label: "KI BLAST SUPER", value: 92 }
            ],
            equipment: ["Signal Breaker", "Ki Frequency Amplifier", "Telemetry Visor"]
        },
        "novaframe": {
            id: "novaframe",
            callsign: "NOVAFRAME",
            realName: "Nico Vale",
            showTitle: "Project: Neon Archive",
            role: "Visual Systems / Defense Specialist",
            race: "Android Class",
            status: "STANDBY / TRAINING",
            height: "6'1\"",
            avatarUrl: "",
            bio: "Constructed for visual data processing and rapid-fire defensive counters.",
            narrative: "Protects team assets while rendering real-time battle capture feeds.",
            capabilities: "Balanced endurance fighter utilizing energy shields and timing macros.",
            skills: [
                { label: "MAX HEALTH", value: 88 },
                { label: "MAX KI", value: 80 },
                { label: "MAX STAMINA", value: 85 },
                { label: "BASIC ATTACK", value: 82 },
                { label: "STRIKE SUPER", value: 70 },
                { label: "KI BLAST SUPER", value: 84 }
            ],
            equipment: ["Energy Barrier", "Vosk Offline Processor", "Artscape Shielding"]
        },
        "razorbyte": {
            id: "razorbyte",
            callsign: "RAZORBYTE",
            realName: "Rex Onyx",
            showTitle: "Project: Phantom Frequency",
            role: "Field Specialist / Blitz Strike",
            race: "Saiyan",
            status: "ACTIVE",
            height: "6'0\"",
            avatarUrl: "",
            bio: "An aggressive frontline combatant specializing in fast combo strings.",
            narrative: "Provides high-speed backup during Time Patrol raid encounters.",
            capabilities: "Rapid combo scaling paired with high physical Stamina.",
            skills: [
                { label: "MAX HEALTH", value: 82 },
                { label: "MAX KI", value: 78 },
                { label: "MAX STAMINA", value: 92 },
                { label: "BASIC ATTACK", value: 90 },
                { label: "STRIKE SUPER", value: 88 },
                { label: "KI BLAST SUPER", value: 68 }
            ],
            equipment: ["Blitz Gauntlets", "Stamina Recovery Capsule"]
        }
    };

    function renderDossier() {
        const urlParams = new URLSearchParams(window.location.search);
        let heroId = urlParams.get('id');

        if (!heroId) {
            heroId = 'kaige'; // Default fallback hero
        }

        // Check LocalStorage custom creations first, then fallback to defaultHeroes
        const savedCharacters = JSON.parse(localStorage.getItem('pantheon_characters') || '{}');
        const hero = savedCharacters[heroId] || defaultHeroes[heroId] || defaultHeroes['kaige'];

        const container = document.getElementById('dossier-content');
        const initials = hero.callsign.substring(0, 2).toUpperCase();

        const avatarHTML = hero.avatarUrl 
            ? `<img src="${hero.avatarUrl}" alt="${hero.callsign}">` 
            : initials;

        container.innerHTML = `
            <!-- HERO HEADER CARD -->
            <div class="card">
                <div class="card-header">
                    <span>HERO PROFILE // SCOUTER ANALYSIS</span>
                    <a href="builder.html" style="color:var(--db-gold); font-size:0.75rem; text-decoration:none;">[EDIT IN HERO BUILDER ↗]</a>
                </div>

                <div class="hero-banner">
                    <div class="hero-avatar">${avatarHTML}</div>
                    <div class="hero-meta">
                        <h1 class="hero-callsign">${hero.callsign}</h1>
                        <div class="hero-subtitle">${hero.role}</div>
                    </div>
                </div>

                <div class="spec-grid">
                    <div class="spec-item">
                        <span class="spec-label">SHOW PROJECT</span>
                        <span class="spec-val">${hero.showTitle || 'N/A'}</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">REAL NAME</span>
                        <span class="spec-val">${hero.realName || 'Restricted'}</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">RACE / SPECIES</span>
                        <span class="spec-val">${hero.race || 'Unspecified'}</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">HEIGHT</span>
                        <span class="spec-val">${hero.height || 'N/A'}</span>
                    </div>
                </div>
            </div>

            <!-- DEEP LORE CARD -->
            <div class="card">
                <div class="card-header">DEEP LORE & SHOW ARCS</div>
                
                <div class="lore-block">
                    <div class="lore-title">1. ORIGIN & CHARACTER BACKSTORY</div>
                    <div class="lore-text">${hero.bio || 'No backstory registered.'}</div>
                </div>

                <div class="lore-block">
                    <div class="lore-title">2. SHOW SAGA & NARRATIVE TRAJECTORY</div>
                    <div class="lore-text">${hero.narrative || hero.showRole || 'No show arc registered.'}</div>
                </div>

                <div class="lore-block">
                    <div class="lore-title">3. COMBAT CAPABILITIES & SPATIAL SYSTEMS</div>
                    <div class="lore-text">${hero.capabilities || 'No combat systems registered.'}</div>
                </div>
            </div>

            <!-- XENOVERSE ATTRIBUTES & EQUIPMENT CARD -->
            <div class="card">
                <div class="card-header">XENOVERSE ATTRIBUTES & SIGNATURE SKILLS</div>
                
                <div class="grid-2">
                    <!-- POWER GRID METERS -->
                    <div class="stat-bar-group">
                        <div style="font-size:0.75rem; color:var(--db-gold); font-weight:bold; margin-bottom:6px;">POWER GRID METERS</div>
                        ${(hero.skills || []).map(s => `
                            <div class="stat-row">
                                <span class="stat-label">${s.label}</span>
                                <div class="stat-track">
                                    <div class="stat-fill" style="width: ${s.value}%;"></div>
                                </div>
                                <span class="stat-num">${s.value}</span>
                            </div>
                        `).join('')}
                    </div>

                    <!-- SIGNATURE EQUIPMENT TAGS -->
                    <div>
                        <div style="font-size:0.75rem; color:var(--db-gold); font-weight:bold; margin-bottom:12px;">SIGNATURE SKILLS & GEAR</div>
                        <div class="tag-cloud">
                            ${(hero.equipment || []).map(item => `
                                <span class="eq-tag">[ ${item} ]</span>
                            `).join('')}
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    renderDossier();
</script>

</body>
</html>
