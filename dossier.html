<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANTHEON STUDIOS // HERO DOSSIER WIKI</title>
    <style>
        :root {
            --bg-void: #060913;
            --db-gold: #ffb700;
            --db-orange: #ff5500;
            --db-cyan: #00e5ff;
            --db-ki: #00ff88;
            --db-red: #ff3333;
            --panel-bg: rgba(12, 18, 32, 0.92);
            --scouter-glow: 0 0 15px rgba(255, 183, 0, 0.35);
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-void);
            color: var(--db-cyan);
            font-family: var(--font-mono);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 183, 0, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 4px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* HEADER BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--db-gold);
            padding-bottom: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(255, 183, 0, 0.2);
        }

        .sys-title {
            font-size: 1.1rem;
            color: var(--db-gold);
            letter-spacing: 2px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .pulse-orb {
            width: 12px;
            height: 12px;
            background: var(--db-ki);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--db-ki);
            animation: dbPulse 1.2s infinite alternate;
        }

        @keyframes dbPulse { 
            0% { opacity: 0.4; transform: scale(0.9); } 
            100% { opacity: 1; transform: scale(1.2); } 
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--db-cyan);
            color: var(--db-cyan);
            padding: 6px 12px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: var(--db-cyan);
            color: #000;
            box-shadow: 0 0 10px var(--db-cyan);
        }

        /* CARD CONTAINERS */
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--db-gold);
            box-shadow: var(--scouter-glow);
            padding: 22px;
            margin-bottom: 25px;
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .card-header {
            font-size: 0.95rem;
            color: var(--db-gold);
            border-bottom: 1px dashed rgba(255, 183, 0, 0.4);
            padding-bottom: 8px;
            margin-bottom: 18px;
            letter-spacing: 1px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* HERO HEADER BLOCK */
        .hero-banner {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .hero-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--db-gold);
            box-shadow: 0 0 15px rgba(255, 183, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            background: rgba(6, 9, 19, 0.95);
            flex-shrink: 0;
            overflow: hidden;
        }

        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-meta {
            flex: 1;
        }

        .hero-callsign {
            font-size: 1.8rem;
            color: #ffffff;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
        }

        .hero-subtitle {
            font-size: 0.9rem;
            color: var(--db-orange);
            font-weight: bold;
            margin-top: 4px;
        }

        .spec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 15px;
            background: rgba(6, 9, 19, 0.8);
            padding: 12px;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .spec-label {
            font-size: 0.65rem;
            color: #8a9ba8;
            text-transform: uppercase;
        }

        .spec-val {
            font-size: 0.8rem;
            color: var(--db-ki);
            font-weight: bold;
        }

        /* LORE SECTIONS */
        .lore-block {
            margin-bottom: 18px;
        }

        .lore-title {
            font-size: 0.8rem;
            color: var(--db-cyan);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .lore-text {
            font-size: 0.85rem;
            color: #d0e0f0;
            line-height: 1.6;
            background: rgba(6, 9, 19, 0.6);
            padding: 12px;
            border-left: 3px solid var(--db-gold);
        }

        .lore-text ul {
            margin: 8px 0 0 0;
            padding-left: 20px;
        }

        .lore-text li {
            margin-bottom: 6px;
        }

        /* XENOVERSE POWER GRID */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stat-bar-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            font-size: 0.75rem;
        }

        .stat-label {
            width: 120px;
            color: #8a9ba8;
            font-weight: bold;
            text-transform: uppercase;
        }

        .stat-track {
            flex: 1;
            height: 14px;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--db-gold), var(--db-ki));
            box-shadow: 0 0 8px var(--db-ki);
        }

        .stat-num {
            width: 40px;
            text-align: right;
            color: #ffffff;
            font-weight: bold;
        }

        /* EQUIPMENT TAG CLOUD */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .eq-tag {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--db-cyan);
            color: var(--db-cyan);
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>

    function renderDossier() {
        const urlParams = new URLSearchParams(window.location.search);
        let heroId = urlParams.get('id');

        if (!heroId) {
            heroId = 'kaige'; // Default fallback hero

        // Checks defaultHeroes first so hardcoded file edits take priority over stored browser memory

        const container = document.getElementById('dossier-content');
        const initials = hero.callsign.substring(0, 2).toUpperCase();
