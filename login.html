<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANTHEON STUDIOS // USER AUTHENTICATION</title>
    <style>
        :root {
            --bg-void: #060913;
            --db-gold: #ffb700;
            --db-orange: #ff5500;
            --db-cyan: #00e5ff;
            --db-ki: #00ff88;
            --db-red: #ff3333;
            --panel-bg: rgba(12, 18, 32, 0.95);
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-void);
            color: var(--db-cyan);
            font-family: var(--font-mono);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 183, 0, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 4px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        /* NAV HEADER */
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0 25px 0;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
            margin-bottom: 40px;
            width: 100%;
        }

        .nav-brand {
            font-size: 1.2rem;
            font-weight: 900;
            color: #00ff88;
            letter-spacing: 2px;
        }

        .nav-menu {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .nav-menu a {
            color: #c0daf0;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-menu a.active, .nav-menu a:hover {
            color: var(--db-gold);
        }

        .nav-menu a.nav-admin-link {
            display: none;
            color: var(--db-red);
        }

        .nav-menu a.nav-admin-link:hover, .nav-menu a.nav-admin-link.active {
            color: var(--db-gold);
        }


        /* AUTH CARD */
        .auth-box {
            background: var(--panel-bg);
            border: 1px solid var(--db-cyan);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 30px;
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            padding-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #8a9ba8;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: bold;
            padding: 8px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .tab-btn.active {
            color: var(--db-gold);
            border-bottom: 2px solid var(--db-gold);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            color: #8a9ba8;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            background: rgba(6, 9, 19, 0.9);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: #ffffff;
            padding: 10px 12px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            outline: none;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: var(--db-gold);
            box-shadow: 0 0 8px rgba(255, 183, 0, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: var(--db-ki);
            color: #000;
            border: none;
            padding: 12px;
            font-family: var(--font-mono);
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 1.5px;
            margin-top: 10px;
        }

        .auth-msg {
            margin-top: 15px;
            font-size: 0.75rem;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <div class="nav-brand">PANTHEON STUDIOS // AUTH GATE</div>
        <div class="nav-menu">
            <a href="index.html">HUB</a>
            <a href="login.html" class="active">LOGIN/SIGN UP</a>
            <a href="archives.html">ARCHIVES</a>
            <a href="community.html">COMMUNITY</a>
            <a href="admin.html" class="nav-admin-link" id="nav-admin-dashboard">ADMIN DASHBOARD</a>
        </div>
    </div>

    <div class="auth-box">
        <div class="auth-tabs">
            <button class="tab-btn active" id="btn-tab-login" onclick="switchTab('login')">LOGIN</button>
            <button class="tab-btn" id="btn-tab-signup" onclick="switchTab('signup')">CREATE ACCOUNT</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="form-login" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">CALLSIGN / USERNAME</label>
                <input type="text" id="login-callsign" class="form-input" required placeholder="e.g., blackbasilisk42">
            </div>
            <div class="form-group">
                <label class="form-label">SECURITY PASSKEY</label>
                <input type="password" id="login-password" class="form-input" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit" id="btn-login-submit">AUTHENTICATE SESSION</button>
        </form>

        <!-- SIGNUP FORM -->
        <form id="form-signup" onsubmit="handleSignup(event)" style="display: none;">
            <div class="form-group">
                <label class="form-label">CHOOSE CALLSIGN / USERNAME</label>
                <input type="text" id="signup-callsign" class="form-input" required placeholder="e.g., KAIGE_FAN">
            </div>
            <div class="form-group">
                <label class="form-label">SECURITY PASSKEY</label>
                <input type="password" id="signup-password" class="form-input" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit" style="background:var(--db-gold);">REGISTER NEW ACCOUNT</button>
        </form>

        <div id="auth-msg" class="auth-msg"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD8k_5c_4mxpJCtKIYxiko8i1mY1vxg2dQ",
        authDomain: "pantheon-ba229.firebaseapp.com",
        projectId: "pantheon-ba229",
        storageBucket: "pantheon-ba229.firebasestorage.app",
        messagingSenderId: "578947122045",
        appId: "1:578947122045:web:5343b13612fab74ea64214"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Check if user is already logged in as admin or standard member
    if (localStorage.getItem('userRole') === 'admin') {
        window.location.href = 'admin.html';
    } else if (localStorage.getItem('pantheon_active_session')) {
        window.location.href = 'profile.html'; // Changed from account.html to match profile context
    }

    /**
     * Attempt Super Admin Login
     * @param {string} username
     * @param {string} password
     * @returns {boolean}
     */
    function attemptAdminLogin(username, password) {
        if (username === 'blackbasilisk42' && password === '@croatoan') {
            localStorage.setItem('userRole', 'admin');
            localStorage.setItem('pantheon_active_session', 'blackbasilisk42');
            localStorage.setItem('pantheon_director_authenticated', 'true');
            window.location.href = 'admin.html';
            return true;
        } else {
            const msg = document.getElementById('auth-msg');
            msg.style.color = 'var(--db-red)';
            msg.innerText = 'INVALID CREDENTIALS. ACCESS DENIED.';
            return false;
        }
    }

    /**
     * Check Admin Access and reveal nav link
     */
    function checkAdminAccess() {
        const userRole = localStorage.getItem('userRole');
        const adminLinks = document.querySelectorAll('.nav-admin-link, #nav-admin-dashboard');
        if (!adminLinks.length) return;

        const isAdmin = (userRole === 'admin') || 
                        (localStorage.getItem('pantheon_director_authenticated') === 'true');

        adminLinks.forEach(link => {
            link.style.display = isAdmin ? 'block' : 'none';
        });
    }

    /**
     * Admin Logout
     */
    function adminLogout() {
        localStorage.removeItem('userRole');
        localStorage.removeItem('pantheon_director_authenticated');
        localStorage.removeItem('pantheon_active_session');
        checkAdminAccess();
        window.location.href = 'login.html';
    }

    function switchTab(mode) {
        const loginForm = document.getElementById('form-login');
        const signupForm = document.getElementById('form-signup');
        const loginBtn = document.getElementById('btn-tab-login');
        const signupBtn = document.getElementById('btn-tab-signup');
        const msg = document.getElementById('auth-msg');

        msg.innerText = '';
        if (mode === 'login') {
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
            loginBtn.classList.add('active');
            signupBtn.classList.remove('active');
        } else {
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
            signupBtn.classList.add('active');
            loginBtn.classList.remove('active');
        }
    }

    async function handleSignup(e) {
        e.preventDefault();
        const callsign = document.getElementById('signup-callsign').value.trim();
        const password = document.getElementById('signup-password').value;
        const msg = document.getElementById('auth-msg');

        if (!callsign || !password) return;

        msg.style.color = 'var(--db-gold)';
        msg.innerText = 'COMMUNICATING WITH SERVER...';

        try {
            const docRef = doc(db, "users", callsign.toLowerCase());
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                msg.style.color = 'var(--db-red)';
                msg.innerText = 'ERROR: CALLSIGN ALREADY REGISTERED';
                return;
            }

            // Register new user to Firestore
            await setDoc(docRef, {
                callsign: callsign,
                password: password, // Note: In a production app, use Firebase Auth instead of storing plaintext passwords
                role: 'user',
                joined: new Date().toISOString()
            });

            localStorage.setItem('pantheon_active_session', callsign);
            localStorage.setItem('userRole', 'user');

            checkAdminAccess();

            msg.style.color = 'var(--db-ki)';
            msg.innerText = 'ACCOUNT CREATED. REDIRECTING TO WORKSPACE...';

            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 1200);

        } catch (error) {
            console.error("Signup Error:", error);
            msg.style.color = 'var(--db-red)';
            msg.innerText = 'SERVER ERROR: UNABLE TO REGISTER ACCOUNT.';
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        const callsign = document.getElementById('login-callsign').value.trim();
        const password = document.getElementById('login-password').value;
        const msg = document.getElementById('auth-msg');

        // Check if matching Super Admin
        if (callsign === 'blackbasilisk42') {
            attemptAdminLogin(callsign, password);
            return;
        }

        msg.style.color = 'var(--db-gold)';
        msg.innerText = 'AUTHENTICATING...';

        try {
            const docRef = doc(db, "users", callsign.toLowerCase());
            const docSnap = await getDoc(docRef);

            if (docSnap.exists() && docSnap.data().password === password) {
                const user = docSnap.data();
                localStorage.setItem('pantheon_active_session', user.callsign);
                const role = user.role || 'user';
                localStorage.setItem('userRole', role);

                checkAdminAccess();

                msg.style.color = 'var(--db-ki)';
                msg.innerText = 'AUTHENTICATED. ACCESSING WORKSPACE...';

                setTimeout(() => {
                    window.location.href = role === 'admin' ? 'admin.html' : 'profile.html';
                }, 1000);
            } else {
                msg.style.color = 'var(--db-red)';
                msg.innerText = 'INVALID CALLSIGN OR PASSKEY.';
            }
        } catch (error) {
            console.error("Login Error:", error);
            msg.style.color = 'var(--db-red)';
            msg.innerText = 'SERVER ERROR: UNABLE TO AUTHENTICATE.';
        }
    }

    // Expose functions to window
    window.switchTab = switchTab;
    window.handleSignup = handleSignup;
    window.handleLogin = handleLogin;
    window.attemptAdminLogin = attemptAdminLogin;
    window.adminLogout = adminLogout;

    checkAdminAccess();

</script>

</body>
</html>
